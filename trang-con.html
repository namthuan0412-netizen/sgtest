<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang con – Sun Group (tạm)</title>
<meta name="robots" content="noindex">
<!-- TRANG TẠM cho các cục ở section 9: bấm cục → mở trang này kèm ?c=<mã>.
     Khi có link trang con thật, chỉ cần đổi href của từng cục trong index.html (TODO(content)). -->
<style>
@font-face {
  font-family: "CDA Independence";
  src: url("assets/fonts/CDAIndependenceText-VF.woff2") format("woff2-variations"),
       url("assets/fonts/CDAIndependenceText-VF.woff2") format("woff2");
  font-weight: 400 700;
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 48px 20px;
  background: radial-gradient(70.71% 70.71% at 50% 50%, #750d1b 0%, #4b0d18 100%);
  color: #f8f2e9;
  font-family: "CDA Independence", "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
  text-align: center;
}
.box { max-width: 640px; display: grid; justify-items: center; gap: 24px; }
.box img { width: 220px; height: auto; max-width: 60vw; }
.box img[hidden] { display: none; }
h1 {
  margin: 0;
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 500;
  line-height: 1.3;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffe284 0%, #d9b137 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
p { margin: 0; font-size: 18px; line-height: 1.5; opacity: 0.85; }
a.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  margin-top: 8px;
  padding: 8px 18px;
  border: 0.75px solid #fff7e4;
  border-radius: 2px;
  background: radial-gradient(237.74px 151.47px at 50% 50%, #f7e6b8 0%, #c7ad8a 25%, #af9173 37.5%, #96755c 50%, #7e5846 62.5%, #663c2f 75%, #4e2018 87.5%, #42110c 93.75%, #360301 100%);
  box-shadow: inset 0 3px 2px rgba(255, 255, 255, 0.25);
  color: #4e0e19;
  font-size: 18px;
  font-weight: 500;
  text-decoration: none;
}
a.back:hover { filter: brightness(1.08); }
a.back:focus-visible { outline: 2px solid #ffe284; outline-offset: 3px; }
</style>
</head>
<body>
<main class="box">
  <img id="logo" src="" alt="" width="319" height="160" hidden>
  <h1 id="name">Trang con</h1>
  <p>Trang con này đang được xây dựng.</p>
  <a class="back" href="./#he-sinh-thai-trai-nghiem">← Quay lại hệ sinh thái</a>
</main>
<script>
(function () {
  var MAP = {
    'sun-group-international-hospital': ['Sun Group International Hospital', 'logo-sun-group-international-hospital.webp'],
    'sun-world': ['Sun World', 'logo-sun-world.webp'],
    'sun-property': ['Sun Property', 'logo-sun-property.webp'],
    'sun-phuquoc-airways': ['Sun PhuQuoc Airways', 'logo-sun-phuquoc-airways.webp'],
    'sac': ['Sun Airport JSC (SAC)', 'logo-sac.webp'],
    'sun-paradise-land': ['Sun Paradise Land', 'logo-sun-paradise-land.webp']
  };
  var c = new URLSearchParams(location.search).get('c');
  var item = c && Object.prototype.hasOwnProperty.call(MAP, c) ? MAP[c] : null;
  if (!item) return;
  document.getElementById('name').textContent = item[0];
  document.title = item[0] + ' – Sun Group (tạm)';
  var img = document.getElementById('logo');
  img.src = 'assets/img/s9/' + item[1];
  img.alt = item[0];
  img.hidden = false;
})();
</script>
</body>
</html>
